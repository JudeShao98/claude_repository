<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>计算器 Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator" role="application" aria-label="计算器">
    <!-- Display: shows the running expression and the current result -->
    <section class="display">
      <div class="display__history" id="history" aria-live="polite"></div>
      <div class="display__current" id="current" aria-live="assertive">0</div>
    </section>

    <!-- Keypad -->
    <div class="keys">
      <button type="button" class="key key--func" data-action="clear">AC</button>
      <button type="button" class="key key--func" data-action="delete">DEL</button>
      <button type="button" class="key key--func" data-action="percent">%</button>
      <button type="button" class="key key--op" data-op="/">÷</button>

      <button type="button" class="key" data-num="7">7</button>
      <button type="button" class="key" data-num="8">8</button>
      <button type="button" class="key" data-num="9">9</button>
      <button type="button" class="key key--op" data-op="*">×</button>

      <button type="button" class="key" data-num="4">4</button>
      <button type="button" class="key" data-num="5">5</button>
      <button type="button" class="key" data-num="6">6</button>
      <button type="button" class="key key--op" data-op="-">−</button>

      <button type="button" class="key" data-num="1">1</button>
      <button type="button" class="key" data-num="2">2</button>
      <button type="button" class="key" data-num="3">3</button>
      <button type="button" class="key key--op" data-op="+">+</button>

      <button type="button" class="key key--zero" data-num="0">0</button>
      <button type="button" class="key" data-num=".">.</button>
      <button type="button" class="key key--equals" data-action="equals">=</button>
    </div>
  </main>

  <script src="calculator.js"></script>
</body>
</html>
